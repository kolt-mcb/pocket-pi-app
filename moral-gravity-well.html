<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moral Gravity Well</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #c8c8d4;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; right: 0;
    pointer-events: none; z-index: 10;
    display: flex; justify-content: center; padding: 24px;
  }
  .title { text-align: center; opacity: 0.7; }
  .title h1 {
    font-size: 1.4rem; font-weight: 300;
    letter-spacing: 0.3em; text-transform: uppercase; color: #e0d8f0;
  }
  .title p {
    font-size: 0.75rem; letter-spacing: 0.15em;
    color: #8888a0; margin-top: 4px;
  }
  .legend {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 32px; z-index: 10; pointer-events: none;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.7rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: #8888a0;
    transition: opacity 0.4s;
  }
  .legend-item:not(.hidden) { opacity: 1; color: #e0d8f0; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .tooltip {
    position: fixed; z-index: 20;
    background: rgba(14, 14, 22, 0.95);
    border: 1px solid rgba(200, 200, 212, 0.15);
    border-radius: 12px; padding: 16px 20px;
    max-width: 320px; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
    backdrop-filter: blur(12px);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip h3 {
    font-size: 0.85rem; font-weight: 500;
    color: #e0d8f0; margin-bottom: 6px;
  }
  .tooltip p {
    font-size: 0.72rem; line-height: 1.6; color: #9898b0;
  }
  .controls {
    position: fixed; bottom: 72px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .controls button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #9898b0; padding: 6px 16px;
    border-radius: 20px; font-size: 0.65rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.08); color: #e0d8f0;
  }
  .controls button.off {
    opacity: 0.35; text-decoration: line-through;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">
  <div class="title">
    <h1>The Moral Gravity Well</h1>
    <p>A being opposed to the good has no axis of neutrality</p>
  </div>
</div>
<div class="controls">
  <button id="btnGood" onclick="toggleLayer('good')">Pure Good</button>
  <button id="btnEvil" onclick="toggleLayer('evil')">Positive Evil</button>
  <button id="btnNeutral" onclick="toggleLayer('neutral')">Neutrality</button>
</div>
<div class="legend">
  <div class="legend-item" id="legGood">
    <div class="legend-dot" style="background:#6ee7b7;"></div>Pure Good
  </div>
  <div class="legend-item" id="legNeutral">
    <div class="legend-dot" style="background:#fbbf24;"></div>Seeming Neutrality
  </div>
  <div class="legend-item" id="legEvil">
    <div class="legend-dot" style="background:#f87171;"></div>Positive Evil
  </div>
</div>
<div class="tooltip" id="tooltip">
  <h3 id="ttTitle"></h3>
  <p id="ttText"></p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const ttTitle = document.getElementById('ttTitle');
const ttText = document.getElementById('ttText');

let W, H, cx, cy, time = 0;
let mouse = { x: -9999, y: -9999 };
let hoveredNode = null;
const layers = { good: true, evil: true, neutral: true };

const COLORS = {
  good: { r: 110, g: 231, b: 183 },
  evil: { r: 248, g: 113, b: 113 },
  neutral: { r: 251, g: 191, b: 36 },
  well: { r: 140, g: 100, b: 255 }
};

function hex(c, a = 1) {
  return `rgba(${c.r},${c.g},${c.b},${a})`;
}

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
});
window.dispatchEvent(new Event('resize'));

// Node data
const nodeData = [
  // GOOD — clean orbits, unaffected by pull
  ...Array.from({ length: 6 }, (_, i) => ({
    layer: 'good', angle: (Math.PI * 2 / 6) * i,
    radius: 150 + i * 8, speed: 0.12 + i * 0.01,
    wobble: 10, wobbleSpd: 0.3 + i * 0.05,
    size: 4 + i * 0.3,
    title: ['Charity','Justice','Mercy','Sacrifice','Truth','Compassion'][i],
    desc: 'Flows from love of the good. Unaffected by the well — orbits in clean, predictable paths beyond its pull.'
  })),

  // EVIL — tight spirals, drawn inward fast
  ...Array.from({ length: 8 }, (_, i) => ({
    layer: 'evil', angle: (Math.PI * 2 / 8) * i,
    baseRadius: 30 + i * 7,
    speed: 0.45 + i * 0.06,
    spiral: 0.3 + i * 0.04,
    size: 3 + i * 0.15,
    title: ['Harm','Deception','Spite','Corruption','Betrayal','Vengeance','Greed','Hatred'][i],
    desc: 'Drawn tightly into the well. Every malicious act spirals inward, accelerating as opposition concentrates.'
  })),

  // NEUTRAL — appears clean, bends visibly toward the well
  ...Array.from({ length: 10 }, (_, i) => ({
    layer: 'neutral', angle: (Math.PI * 2 / 10) * i + 0.3,
    baseRadius: 90 + i * 12,
    speed: 0.2 + i * 0.008,
    wobble: 8 + i * 1.5, wobbleSpd: 0.25 + i * 0.02,
    size: 3.5 + i * 0.15,
    title: ['Walking','Eating','Resting','Counting','Watching','Breathing','Waiting','Listening','Reading','Choosing'][i],
    desc: i % 2 === 0
      ? '"Neutral" path that visibly bends toward the well. The act seems simple — but its trajectory reveals the chooser\'s orientation.'
      : 'What looks like indifference is a bent line. The gravity of opposition distorts even the straightest intentions.'
  }))
];

nodeData.forEach(n => { n.x = 0; n.y = 0; n.trail = []; });

// Ambient particles
const particles = Array.from({ length: 60 }, () => ({
  nx: Math.random() * 2 - 1, ny: Math.random() * 2 - 1,
  z: Math.random(),
  vx: (Math.random() - 0.5) * 0.0003,
  vy: (Math.random() - 0.5) * 0.0003,
  size: 1 + Math.random() * 1.5,
  alpha: 0.08 + Math.random() * 0.15
}));

function getNodePos(n, t) {
  if (n.layer === 'good') {
    const a = n.angle + t * n.speed;
    const r = n.radius + Math.sin(t * n.wobbleSpd + n.angle) * n.wobble;
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  }
  if (n.layer === 'evil') {
    const a = n.angle + t * n.speed;
    const r = n.baseRadius * (1 - Math.sin(t * n.spiral) * 0.25);
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  }
  // Neutral: gets pulled
  const a = n.angle + t * n.speed;
  const r = n.baseRadius + Math.sin(t * n.wobbleSpd + n.angle) * n.wobble;
  let x = cx + Math.cos(a) * r;
  let y = cy + Math.sin(a) * r;
  const dx = cx - x, dy = cy - y;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const pull = Math.min(2500 / (r * r + 500) * 0.4, 35);
  x += (dx / dist) * pull * Math.sin(t * 0.7);
  y += (dy / dist) * pull * Math.cos(t * 0.7);
  return { x, y };
}

// ── Drawing functions ──

function drawBackground() {
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.6);
  bg.addColorStop(0, '#141420');
  bg.addColorStop(1, '#0a0a0f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
}

function drawParticles() {
  particles.forEach(p => {
    p.nx += p.vx; p.ny += p.vy;
    if (p.nx < -1 || p.nx > 1) p.vx *= -1;
    if (p.ny < -1 || p.ny > 1) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(cx + p.nx * W * 0.5, cy + p.ny * H * 0.5, p.size * p.z, 0, Math.PI * 2);
    ctx.fillStyle = hex(COLORS.well, p.alpha * p.z);
    ctx.fill();
  });
}

function drawGrid() {
  ctx.lineWidth = 0.5;
  const sp = 45;
  for (let gx = -cx; gx < W - cx; gx += sp) {
    ctx.beginPath();
    for (let gy = -cy; gy < H - cy; gy += 3) {
      const wx = cx + gx, wy = cy + gy;
      const ddx = wx - cx, ddy = wy - cy;
      const dd = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
      const d = 2500 / (dd*dd + 800);
      const sx = wx + (ddx/dd) * d * Math.sin(time * 0.5) * 0.08;
      const sy = wy + (ddy/dd) * d * Math.cos(time * 0.5) * 0.08;
      if (gy === -cy) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = hex(COLORS.well, 0.03);
    ctx.stroke();
  }
  for (let gy = -cy; gy < H - cy; gy += sp) {
    ctx.beginPath();
    for (let gx = -cx; gx < W - cx; gx += 3) {
      const wx = cx + gx, wy = cy + gy;
      const ddx = wx - cx, ddy = wy - cy;
      const dd = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
      const d = 2500 / (dd*dd + 800);
      const sx = wx + (ddx/dd) * d * Math.sin(time * 0.5) * 0.08;
      const sy = wy + (ddy/dd) * d * Math.cos(time * 0.5) * 0.08;
      if (gx === -cx) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.strokeStyle = hex(COLORS.well, 0.03);
    ctx.stroke();
  }
}

function drawWell(t) {
  // Rings
  for (let ring = 5; ring >= 0; ring--) {
    const r = 55 + ring * 28 + Math.sin(t * 0.3 + ring) * 5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = hex(COLORS.well, 0.03 + (5 - ring) * 0.012);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // Spiral arms
  for (let arm = 0; arm < 3; arm++) {
    ctx.beginPath();
    const ba = (Math.PI * 2 / 3) * arm + t * 0.2;
    for (let s = 0; s < 180; s++) {
      const sr = 15 + s * 0.8;
      const sa = ba + s * 0.04;
      const px = cx + Math.cos(sa) * sr, py = cy + Math.sin(sa) * sr;
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = hex(COLORS.well, 0.05 + Math.sin(t + arm) * 0.015);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // Core glow
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
  cg.addColorStop(0, hex(COLORS.well, 0.35));
  cg.addColorStop(0.5, hex(COLORS.well, 0.1));
  cg.addColorStop(1, 'transparent');
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
  ctx.fillStyle = cg; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = hex(COLORS.well, 0.85); ctx.fill();
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillStyle = hex(COLORS.well, 0.35);
  ctx.fillText('ORIENTATION OF OPPOSITION', cx, cy + 52);
}

function drawTrails(t) {
  nodeData.filter(n => n.layer === 'neutral' && layers.neutral).forEach((n, idx) => {
    if (n.trail.length < 2) return;
    for (let i = 1; i < n.trail.length; i++) {
      const alpha = (i / n.trail.length) * 0.12;
      ctx.beginPath();
      ctx.moveTo(n.trail[i-1].x, n.trail[i-1].y);
      ctx.lineTo(n.trail[i].x, n.trail[i].y);
      ctx.strokeStyle = hex(COLORS.neutral, alpha);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });
}

function drawNodes(t) {
  nodeData.forEach((n, idx) => {
    if (!layers[n.layer]) return;
    const pos = getNodePos(n, t);
    n.x = pos.x; n.y = pos.y;

    // Push trails only for neutral
    if (n.layer === 'neutral' && layers.neutral) {
      n.trail.push({ x: pos.x, y: pos.y });
      if (n.trail.length > 80) n.trail.shift();
    }

    const isHovered = hoveredNode === n;
    const pulse = Math.sin(t * 2 + idx) * 0.3 + 0.7;
    const c = COLORS[n.layer];
    const sz = isHovered ? n.size * 2.5 : n.size * pulse;

    // Glow
    const gl = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, sz * 7);
    gl.addColorStop(0, hex(c, isHovered ? 0.3 : 0.14));
    gl.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(pos.x, pos.y, sz * 7, 0, Math.PI * 2);
    ctx.fillStyle = gl; ctx.fill();

    // Dot
    ctx.beginPath(); ctx.arc(pos.x, pos.y, sz, 0, Math.PI * 2);
    ctx.fillStyle = hex(c, isHovered ? 0.95 : 0.72);
    ctx.fill();

    if (isHovered) {
      ctx.beginPath(); ctx.arc(pos.x, pos.y, sz * 2.2, 0, Math.PI * 2);
      ctx.strokeStyle = hex(c, 0.35); ctx.lineWidth = 1.5; ctx.stroke();
    }
  });
}

function checkHover() {
  hoveredNode = null;
  nodeData.forEach(n => {
    if (!layers[n.layer]) return;
    const dx = mouse.x - n.x, dy = mouse.y - n.y;
    if (Math.sqrt(dx*dx + dy*dy) < 32) hoveredNode = n;
  });
  if (hoveredNode) {
    ttTitle.textContent = hoveredNode.title;
    ttText.textContent = hoveredNode.desc;
    tooltip.classList.add('visible');
    let tx = mouse.x + 20, ty = mouse.y - 20;
    if (tx + 330 > W) tx = mouse.x - 340;
    if (ty < 10) ty = 10;
    if (ty + 130 > H) ty = H - 140;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  } else {
    tooltip.classList.remove('visible');
  }
}

function updateLegend() {
  ['Good','Neutral','Evil'].forEach(type => {
    const key = type.toLowerCase();
    document.getElementById('leg' + type).classList.toggle('hidden', !layers[key]);
  });
  document.getElementById('btnGood').classList.toggle('off', !layers.good);
  document.getElementById('btnEvil').classList.toggle('off', !layers.evil);
  document.getElementById('btnNeutral').classList.toggle('off', !layers.neutral);
}

function toggleLayer(layer) {
  layers[layer] = !layers[layer];
  updateLegend();
}

// Input
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.x = mouse.y = -9999; });

// Main loop
function frame(ts) {
  time = ts * 0.001;
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawParticles();
  drawGrid();
  drawWell(time);
  drawTrails(time);
  drawNodes(time);
  checkHover();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
